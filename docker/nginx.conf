# ── Rate limiting (http 级 zone，被 http{} include 后即 http 级指令) ──
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name api.example.com;

    root /app/public;

    # 与 nginx-admin.conf 对齐：发票/KYC/图片上传 >1M 默认 413，先于 WAF 拒绝超限 multipart body
    client_max_body_size 10M;

    # ── Security headers ──
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # API 为 JSON/静态资源服务：default-src 'none' 拒绝一切脚本注入；
    # style-src 'unsafe-inline' 兼容发票 HTML 兜底页的内联样式
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" always;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml
        text/javascript
        image/svg+xml;
    gzip_disable "msie6";

    # ── Internal service API — never expose publicly ──
    # 全量反代会让公网请求看起来都来自 127.0.0.1；内部端点必须在此拦死，admin 直连 127.0.0.1:8787
    location ^~ /internal/ {
        return 404;
    }

    # 依赖详情不对外；内部调用请直连 8787 并带 X-Internal-Token
    location = /health/deps {
        return 404;
    }

    # ── Proxy ──
    location / {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 20;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：客户端可伪造 XFF 首个值，绕过限流/GeoBlock/登录 IP。
        # 前置 LB/CDN 时先用 real_ip 模块还原可信客户端地址，再由此覆盖。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy buffers — prevent slow clients from blocking workers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Keep-alive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── WebSocket proxy ──
    location /ws/ {
        proxy_pass http://127.0.0.1:8282;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Static assets (optional CDN cache headers) ──
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Uploaded files — 仅暴露 uploads（backups/apple/firebase 等禁止公开）──
    location ^~ /storage/uploads/ {
        alias /app/storage/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}
