global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cloud-platform
    static_configs:
      - targets: ['app:9100']
        labels:
          service: 'cloud-platform'
