<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="mcTitle mcDesc">
  <title id="mcTitle">CloudPlatform 应用图标「云团」</title>
  <desc id="mcDesc">项目宠物「云团」抱着服务器的方形标识，用于 favicon 与客户端应用图标。</desc>

  <defs>
    <linearGradient id="mcBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#5b96f8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#173a9e"/>
    </linearGradient>
    <linearGradient id="mcCloud" gradientUnits="userSpaceOnUse" x1="60" y1="90" x2="450" y2="420">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eaf3fe"/>
      <stop offset="100%" stop-color="#c9dffa"/>
    </linearGradient>
    <linearGradient id="mcServerFill" gradientUnits="userSpaceOnUse" x1="180" y1="238" x2="300" y2="316">
      <stop offset="0%" stop-color="#3f4e63"/>
      <stop offset="100%" stop-color="#1c2735"/>
    </linearGradient>
    <clipPath id="mcClip"><rect width="512" height="512" rx="112"/></clipPath>

    <!-- 与 mascot-v2.svg 同一套几何，整体缩放居中 -->
    <g id="mcBody">
      <circle cx="165" cy="205" r="54"/>
      <circle cx="240" cy="172" r="68"/>
      <circle cx="315" cy="205" r="54"/>
      <rect x="114" y="200" width="252" height="60" rx="30"/>
    </g>
    <g id="mcArmL"><path d="M144,220 C144,268 166,300 196,300" fill="none" stroke-linecap="round"/></g>
    <g id="mcArmR"><path d="M336,220 C336,268 314,300 284,300" fill="none" stroke-linecap="round"/></g>
    <g id="mcServer"><rect x="178" y="238" width="124" height="76" rx="12"/></g>
  </defs>

  <g clip-path="url(#mcClip)">
    <rect width="512" height="512" fill="url(#mcBg)"/>

    <!-- 底纹星点 -->
    <g fill="#ffffff" opacity="0.22">
      <circle cx="72" cy="112" r="7"/>
      <circle cx="446" cy="150" r="9"/>
      <circle cx="404" cy="424" r="7"/>
      <circle cx="96" cy="392" r="6"/>
    </g>
    <!-- 轨道弧（呼应全图，简化） -->
    <path d="M28,246 C60,150 190,96 320,104 C420,110 478,160 492,214"
          fill="none" stroke="#bfdbfe" stroke-width="6" stroke-dasharray="14,14" opacity="0.5" stroke-linecap="round"/>

    <g transform="translate(-104,-63) scale(1.5)">
      <g stroke="#b6d1f3" stroke-width="4" stroke-linejoin="round" fill="#b6d1f3"><use href="#mcBody"/></g>
      <g fill="url(#mcCloud)"><use href="#mcBody"/></g>
      <g fill="#ffffff" opacity="0.6">
        <ellipse cx="216" cy="140" rx="46" ry="16"/>
        <ellipse cx="168" cy="180" rx="24" ry="10"/>
      </g>

      <g fill="#1e3a8a">
        <ellipse cx="212" cy="170" rx="9" ry="10.5"/>
        <ellipse cx="268" cy="170" rx="9" ry="10.5"/>
      </g>
      <g fill="#ffffff" opacity="0.9">
        <circle cx="209" cy="166" r="3.2"/>
        <circle cx="265" cy="166" r="3.2"/>
      </g>
      <g fill="#93c5fd" opacity="0.5">
        <ellipse cx="186" cy="190" rx="14" ry="8"/>
        <ellipse cx="294" cy="190" rx="14" ry="8"/>
      </g>
      <path d="M226,190 Q240,204 254,190" fill="none" stroke="#1e3a8a" stroke-width="2.7" stroke-linecap="round"/>

      <g stroke="#0f172a" stroke-width="2" fill="url(#mcServerFill)"><use href="#mcServer"/></g>
      <rect x="189" y="248" width="102" height="20" rx="5" fill="#0f172a" opacity="0.45"/>
      <g>
        <circle cx="200" cy="258" r="4.5" fill="#22c55e"/>
        <circle cx="215" cy="258" r="4.5" fill="#38bdf8"/>
        <circle cx="230" cy="258" r="4.5" fill="#38bdf8"/>
      </g>
      <rect x="243" y="252" width="42" height="12" rx="3" fill="#0ea5e9" opacity="0.32"/>
      <g stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.85">
        <path d="M214,284 H286"/>
        <path d="M214,296 H286"/>
        <path d="M214,306 H266"/>
      </g>
      <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7">
        <path d="M274,306 H286"/>
      </g>

      <g stroke="#b6d1f3" stroke-width="17" fill="none" stroke-linecap="round"><use href="#mcArmL"/><use href="#mcArmR"/></g>
      <g stroke="url(#mcCloud)" stroke-width="12.5" fill="none" stroke-linecap="round"><use href="#mcArmL"/><use href="#mcArmR"/></g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="511" height="511" rx="112" fill="none" stroke="#173a9e" stroke-opacity="0.3"/>
</svg>
