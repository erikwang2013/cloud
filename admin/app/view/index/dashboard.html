<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <title>控制后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
    <link rel="stylesheet" href="/app/admin/demos/css/console1.css" />
    <style>
        .stat-card { cursor: default; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .top-panel-number { font-size: 32px; font-weight: bold; }
        .stat-card .trend-up { color: #52c41a; }
        .stat-card .trend-down { color: #ff4d4f; }
        .chart-box { min-height: 360px; padding: 10px; }
        .dashboard-toolbar { margin-bottom: 10px; text-align: right; }
        .dashboard-toolbar .pear-btn { margin-left: 8px; }
    </style>
</head>
<body class="pear-container">
    <div>
        <!-- Toolbar -->
        <div class="dashboard-toolbar">
            <button class="pear-btn pear-btn-primary pear-btn-md" id="btn-export-pdf">
                <i class="layui-icon layui-icon-export"></i> 导出PDF
            </button>
            <button class="pear-btn pear-btn-md" id="btn-refresh">
                <i class="layui-icon layui-icon-refresh"></i> 刷新
            </button>
        </div>

        <!-- Stat Cards Row 1 -->
        <div class="layui-row layui-col-space10">
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">今日注册</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-today-users">0</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 1024 1024" width="200" height="200"><path fill="#fcc66f" d="M 262.7 835 c -15.3 0 -28.1 -11.4 -29.8 -26.6 L 174.1 291 c -0.6 -5.1 1 -10.2 4.5 -14 s 8.3 -6 13.4 -6 h 640 c 5.1 0 10 2.2 13.4 6 s 5 8.9 4.5 14 l -58.8 517.4 c -1.7 15.2 -14.5 26.6 -29.8 26.6 H 262.7 Z"/><path fill="#f56e73" d="M 164 307 c -16.5 0 -30 -13.5 -30 -30 v -58 c 0 -16.5 13.5 -30 30 -30 h 696 c 16.5 0 30 13.5 30 30 v 58 c 0 16.5 -13.5 30 -30 30 H 164 Z"/><path fill="#65c8ff" d="M 190.9 651.5 c -31.4 0 -56.9 -25.5 -56.9 -56.9 V 219 c 0 -16.5 13.5 -30 30 -30 h 466.2 c 9.9 0 18 8.1 18 18 v 301.1 c 0 34.7 -28.2 62.9 -62.9 62.9 s -62.9 -28.2 -62.9 -62.9 V 393.5 c 0 -23.2 -18.8 -42 -42 -42 s -42 18.8 -42 42 v 68.1 c 0 29.4 -23.9 53.4 -53.4 53.4 s -53.4 -23.9 -53.4 -53.4 v -68.1 c 0 -23.2 -18.8 -42 -42 -42 s -42 18.8 -42 42 v 201.1 c 0.1 31.4 -25.4 56.9 -56.7 56.9 Z"/><path fill="#453b56" d="M 698 729.4 m -18 0 a 18 18 0 1 0 36 0 a 18 18 0 1 0 -36 0 Z"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">7日内注册</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-week-users">0</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg viewBox="0 0 1024 1024" width="200" height="200"><path d="M123.5 471.3c-9.9 0-18-8.1-18-18v-302c0-9.9 8.1-18 18-18h58c9.9 0 18 8.1 18 18v302c0 9.9-8.1 18-18 18h-58z" fill="#FCC66F"/><path d="M430.8 641.1c-9.9 0-18-8.1-18-18v-21.6c0-130.3 106-236.3 236.3-236.3s236.3 106 236.3 236.3v21.6c0 9.9-8.1 18-18 18H430.8z" fill="#FCC66F"/><path d="M419.6 694.4c-22.1 0-40.1-18-40.1-40.1s18-40.1 40.1-40.1h458.8c22.1 0 40.1 18 40.1 40.1s-18 40.1-40.1 40.1H419.6z" fill="#F56E73"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">30日内注册</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-month-users">0</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg viewBox="0 0 1024 1024" width="200" height="200"><path d="M750.4 216.5h-130v-15.3c0-32.9-26.8-59.7-59.7-59.7h-97.3c-32.9 0-59.7 26.8-59.7 59.7v15.3h-130c-30.7 0-55.6 25-55.6 55.6v72.4c0 9.9 8.1 18 18 18h31.5v478c0 23.2 18.8 42 42 42h405c23.2 0 42-18.8 42-42v-478H788c9.9 0 18-8.1 18-18v-72.4c0-30.6-25-55.6-55.6-55.6z" fill="#FCC66F"/><path d="M309.5 882.5c-23.2 0-42-18.8-42-42V596c0-9.9 8.1-18 18-18h36.8c30.2 0 54.8 24.6 54.8 54.8v231.7c0 9.9-8.1 18-18 18h-49.6zM664.9 882.5c-9.9 0-18-8.1-18-18V632.8c0-30.2 24.6-54.8 54.8-54.8h36.8c9.9 0 18 8.1 18 18v244.5c0 23.2-18.8 42-42 42h-49.6z" fill="#F56E73"/><path d="M475.2 882.5c-9.9 0-18-8.1-18-18V632.8c0-30.2 24.6-54.8 54.8-54.8 30.2 0 54.8 24.6 54.8 54.8v231.7c0 9.9-8.1 18-18 18h-73.6z" fill="#F56E73"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">总用户数</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-total-users">0</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg viewBox="0 0 1024 1024" width="200" height="200"><path d="M363.2 807c-9.9 0-18-8.1-18-18v-75.5c0-9.9 8.1-18 18-18h108.5c9.9 0 18 8.1 18 18V789c0 9.9-8.1 18-18 18H363.2z" fill="#F56E73"/><path d="M259.6 398c-9.9 0-18-8.1-18-18V178.6c0-23.8 19.3-43.1 43.1-43.1s43.1 19.3 43.1 43.1V380c0 9.9-8.1 18-18 18h-50.2zM525.1 398c-9.9 0-18-8.1-18-18V178.6c0-23.8 19.3-43.1 43.1-43.1s43.1 19.3 43.1 43.1V380c0 9.9-8.1 18-18 18h-50.2z" fill="#65C8FF"/><path d="M686 330.5H149c-9.9 0-18 8.1-18 18v63c0 9.9 8.1 18 18 18h33.2l45 225c8.7 43.4 47.1 75 91.4 75h197.6c44.3 0 82.7-31.5 91.4-75l45-225H686c9.9 0 18-8.1 18-18v-63c0-9.9-8.1-18-18-18z" fill="#FCC66F"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stat Cards Row 2 -->
        <div class="layui-row layui-col-space10">
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">今日订单</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-today-orders">-</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg viewBox="0 0 1024 1024" width="200" height="200"><path d="M240 768h544v64H240z" fill="#65C8FF"/><path d="M304 832h416v32H304z" fill="#65C8FF"/><path d="M176 288l160 160 144-144 176 176 144-144 48 48v336H176V288z" fill="#FCC66F"/><circle cx="176" cy="288" r="48" fill="#F56E73"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">今日收入</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-today-revenue">-</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg viewBox="0 0 1024 1024" width="200" height="200"><circle cx="512" cy="512" r="400" fill="#FCC66F"/><circle cx="512" cy="512" r="320" fill="#FFF"/><text x="512" y="540" text-anchor="middle" font-size="280" font-weight="bold" fill="#F56E73">$</text></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">待处理订单</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-pending-orders">-</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg viewBox="0 0 1024 1024" width="200" height="200"><path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z" fill="#FCC66F"/><path d="M512 256v256l192 112" stroke="#F56E73" stroke-width="60" fill="none" stroke-linecap="round"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card top-panel stat-card">
                    <div class="layui-card-header">活跃资源</div>
                    <div class="layui-card-body">
                        <div class="layui-row layui-col-space5">
                            <div class="layui-col-xs8 layui-col-md8 top-panel-number" style="color: #28333E;" id="stat-active-resources">-</div>
                            <div class="layui-col-xs4 layui-col-md4 top-panel-tips">
                                <svg viewBox="0 0 1024 1024" width="200" height="200"><rect x="128" y="640" width="128" height="256" rx="16" fill="#65C8FF"/><rect x="320" y="512" width="128" height="384" rx="16" fill="#65C8FF"/><rect x="512" y="384" width="128" height="512" rx="16" fill="#65C8FF"/><rect x="704" y="256" width="128" height="640" rx="16" fill="#F56E73"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row 1 -->
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md8">
                <div class="layui-card">
                    <div class="layui-card-header">7日用户注册趋势</div>
                    <div class="layui-card-body">
                        <div id="chart-user-trend-7d" class="chart-box"></div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-card">
                    <div class="layui-card-header">系统信息</div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <colgroup><col width="50%"><col></colgroup>
                            <tbody id="system-info"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row 2 -->
        <div class="layui-row layui-col-space10">
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">30日用户注册趋势</div>
                    <div class="layui-card-body">
                        <div id="chart-user-trend-30d" class="chart-box"></div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">用户概览</div>
                    <div class="layui-card-body">
                        <div id="chart-user-summary" class="chart-box"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
    <script src="/app/admin/component/pear/pear.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const DASHBOARD_API = "/app/admin/dashboard/data";

        layui.use(['layer', 'echarts', 'element', 'count', 'jquery'], function() {
            var $ = layui.jquery,
                layer = layui.layer,
                element = layui.element,
                count = layui.count,
                echarts = layui.echarts;

            var chart7d, chart30d, chartSummary;

            // Init charts
            chart7d = echarts.init(document.getElementById('chart-user-trend-7d'), 'walden');
            chart30d = echarts.init(document.getElementById('chart-user-trend-30d'), 'walden');
            chartSummary = echarts.init(document.getElementById('chart-user-summary'), 'walden');

            function loadData() {
                $.ajax({
                    url: DASHBOARD_API,
                    dataType: "json",
                    success: function(res) {
                        if (res.code) return layer.msg(res.msg || '加载失败');
                        var d = res.data;

                        // Animate stat cards
                        count.up("stat-today-users", { time: 3000, num: d.stats.today_users, bit: 0, regulator: 50 });
                        count.up("stat-week-users", { time: 3000, num: d.stats.week_users, bit: 0, regulator: 50 });
                        count.up("stat-month-users", { time: 3000, num: d.stats.month_users, bit: 0, regulator: 50 });
                        count.up("stat-total-users", { time: 3000, num: d.stats.total_users, bit: 0, regulator: 50 });

                        // Service stats (show placeholder if not available)
                        $('#stat-today-orders').text(d.stats.today_orders || '-');
                        $('#stat-today-revenue').text(d.stats.today_revenue || '-');
                        $('#stat-pending-orders').text(d.stats.pending_orders || '-');
                        $('#stat-active-resources').text(d.stats.active_resources || '-');

                        // System info
                        var sys = d.system;
                        $('#system-info').html(
                            '<tr><td>Workerman版本</td><td>'+sys.workerman_version+'</td></tr>' +
                            '<tr><td>Webman版本</td><td>'+sys.webman_version+'</td></tr>' +
                            '<tr><td>Admin版本</td><td>'+sys.admin_version+'</td></tr>' +
                            '<tr><td>PHP版本</td><td>'+sys.php_version+'</td></tr>' +
                            '<tr><td>MySQL版本</td><td>'+sys.mysql_version+'</td></tr>' +
                            '<tr><td>操作系统</td><td>'+sys.os+'</td></tr>'
                        );

                        // 7-day trend chart
                        chart7d.setOption({
                            tooltip: { trigger: 'axis' },
                            grid: { top: '10%', bottom: '6%', left: '6%', right: '6%', containLabel: true },
                            xAxis: {
                                type: 'category',
                                boundaryGap: false,
                                data: d.user_trend_7d.map(function(v){return v.date;})
                            },
                            yAxis: {
                                type: 'value',
                                minInterval: 1
                            },
                            series: [{
                                name: '新用户',
                                type: 'line',
                                smooth: true,
                                showSymbol: true,
                                symbol: 'circle',
                                symbolSize: 6,
                                lineStyle: { width: 3, color: '#5B8FF9' },
                                areaStyle: {
                                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                        {offset: 0, color: 'rgba(91,143,249,0.3)'},
                                        {offset: 1, color: 'rgba(91,143,249,0.02)'}
                                    ])
                                },
                                data: d.user_trend_7d.map(function(v){return v.count;})
                            }]
                        });

                        // 30-day trend chart
                        chart30d.setOption({
                            tooltip: { trigger: 'axis' },
                            grid: { top: '10%', bottom: '6%', left: '6%', right: '6%', containLabel: true },
                            xAxis: {
                                type: 'category',
                                data: d.user_trend_30d.map(function(v){return v.date;}),
                                axisLabel: { interval: 6 }
                            },
                            yAxis: { type: 'value', minInterval: 1 },
                            series: [{
                                name: '新用户',
                                type: 'bar',
                                itemStyle: { color: '#5AD8A6' },
                                data: d.user_trend_30d.map(function(v){return v.count;})
                            }]
                        });

                        // User summary pie chart
                        chartSummary.setOption({
                            tooltip: { trigger: 'item' },
                            series: [{
                                type: 'pie',
                                radius: ['40%', '65%'],
                                avoidLabelOverlap: false,
                                itemStyle: {
                                    borderRadius: 6,
                                    borderColor: '#fff',
                                    borderWidth: 2
                                },
                                label: { show: true, formatter: '{b}: {c}' },
                                data: [
                                    { value: d.stats.today_users, name: '今日注册', itemStyle: { color: '#5B8FF9' } },
                                    { value: d.stats.week_users, name: '7日注册', itemStyle: { color: '#5AD8A6' } },
                                    { value: d.stats.month_users, name: '30日注册', itemStyle: { color: '#F6BD16' } },
                                    { value: d.stats.total_users, name: '总用户', itemStyle: { color: '#E8684A' } }
                                ]
                            }]
                        });
                    }
                });
            }

            loadData();

            // Refresh button
            $('#btn-refresh').on('click', function() { loadData(); });

            // PDF Export
            $('#btn-export-pdf').on('click', function() {
                var btn = $(this);
                btn.attr('disabled', true).text('生成中...');

                var el = document.querySelector('body.pear-container > div');
                html2canvas(el, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#f0f2f5'
                }).then(function(canvas) {
                    var imgData = canvas.toDataURL('image/png');
                    var pdf = new jspdf.jsPDF('p', 'mm', 'a4');
                    var imgWidth = 210;
                    var pageHeight = 297;
                    var imgHeight = canvas.height * imgWidth / canvas.width;
                    var heightLeft = imgHeight;
                    var position = 0;

                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;

                    while (heightLeft > 0) {
                        position = heightLeft - imgHeight;
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }

                    var now = new Date();
                    pdf.save('dashboard_' + now.getFullYear() + ('0'+(now.getMonth()+1)).slice(-2) + ('0'+now.getDate()).slice(-2) + '.pdf');
                    btn.removeAttr('disabled').html('<i class="layui-icon layui-icon-export"></i> 导出PDF');
                }).catch(function() {
                    layer.msg('PDF生成失败，请重试');
                    btn.removeAttr('disabled').html('<i class="layui-icon layui-icon-export"></i> 导出PDF');
                });
            });

            // Resize handler
            window.addEventListener('resize', function() {
                chart7d && chart7d.resize();
                chart30d && chart30d.resize();
                chartSummary && chartSummary.resize();
            });
        });
    </script>
</body>
</html>
