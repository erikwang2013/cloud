<!DOCTYPE html>
<html lang="zh-cn">
    <head>
        <meta charset="utf-8">
        <title>功能开关</title>
        <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css" />
        <link rel="stylesheet" href="/app/admin/admin/css/reset.css" />
    </head>
    <body class="pear-container">

        <div class="layui-card">
            <div class="layui-card-body">
                <table id="data-table" lay-filter="data-table"></table>
            </div>
        </div>

        <!-- 表格行工具栏 -->
        <script type="text/html" id="table-bar">
            <button class="pear-btn pear-btn-xs layui-bg-green" lay-event="enable">开启</button>
            <button class="pear-btn pear-btn-xs tool-btn" lay-event="disable">关闭</button>
            <button class="pear-btn pear-btn-xs tool-btn" lay-event="reset">重置</button>
        </script>

        <script src="/app/admin/component/layui/layui.js?v=2.8.12"></script>
        <script src="/app/admin/component/pear/pear.js"></script>
        <script src="/app/admin/admin/js/permission.js"></script>
        <script src="/app/admin/admin/js/common.js"></script>
        <script>
            const SELECT_API = "/app/admin/feature/select";
            const TOGGLE_API = "/app/admin/feature/toggle";

            layui.use(["table", "form", "common"], function() {
                let table = layui.table;

                table.render({
                    elem: '#data-table',
                    url: SELECT_API,
                    page: false,
                    cols: [[
                        { title: '开关名称', field: 'name', minWidth: 220, align: 'center' },
                        { title: '默认值', field: 'default', minWidth: 100, align: 'center',
                          templet: d => d.default ? '<span class="layui-badge layui-bg-green">开启</span>' : '<span class="layui-badge layui-bg-gray">关闭</span>' },
                        { title: '当前状态', field: 'enabled', minWidth: 100, align: 'center',
                          templet: d => d.enabled ? '<span class="layui-badge layui-bg-green">开启</span>' : '<span class="layui-badge layui-bg-gray">关闭</span>' },
                        { title: '来源', field: 'source', minWidth: 100, align: 'center' },
                        { title: '操作', toolbar: '#table-bar', width: 200, align: 'center' }
                    ]]
                });

                table.on('tool(data-table)', function(obj) {
                    let data = obj.data;
                    layer.confirm('确定' + ({enable: '开启', disable: '关闭', reset: '重置'}[obj.event]) + ' ' + data.name + ' ?', {
                        icon: 3, title: '提示'
                    }, function(index) {
                        layer.close(index);
                        $.post(TOGGLE_API, {name: data.name, action: obj.event}, function(res) {
                            if (res.code === 0) {
                                layer.msg('操作成功');
                                table.reload('data-table');
                            } else {
                                layer.msg(res.msg);
                            }
                        }, 'json');
                    });
                });
            });
        </script>
    </body>
</html>
