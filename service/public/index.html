<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudPlatform — 全球云资源交易平台</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root {
    --brand-deep: #1e40af;
    --brand: #2563eb;
    --brand-light: #3b82f6;
    --sky: #e1ecfb;
    --ground: #f8fafc;
    --text: #1f2937;
    --muted: #64748b;
    --border: #dbe6f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--ground);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 720px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px 36px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(30, 64, 175, .08);
  }
  .mascot { width: 260px; max-width: 70%; height: auto; margin: 0 auto 24px; display: block; }
  h1 {
    margin: 0 0 10px;
    font-size: 28px;
    line-height: 1.3;
    color: var(--brand-deep);
    letter-spacing: .2px;
  }
  .subtitle { margin: 0 auto 28px; max-width: 460px; color: var(--muted); font-size: 15px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .links a {
    flex: 0 1 auto;
    min-width: 168px;
    padding: 12px 22px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--sky);
    color: var(--brand-deep);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    transition: background .18s, border-color .18s, transform .18s;
  }
  .links a:hover {
    background: #d3e3fa;
    border-color: var(--brand-light);
    transform: translateY(-1px);
  }
  .links a.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .links a.primary:hover { background: var(--brand-deep); border-color: var(--brand-deep); }
  a:focus-visible { outline: 3px solid var(--brand-light); outline-offset: 2px; }
  footer {
    margin-top: 30px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #e2e8f0; }
    .card { background: #16213b; border-color: #26324d; box-shadow: none; }
    h1 { color: #93b4fb; }
    .links a { background: #1e2c4a; border-color: #2c3b5c; color: #bfd4fb; }
    .links a.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    footer { border-top-color: #26324d; }
  }
</style>
</head>
<body>
  <main class="card">
    <img class="mascot" src="/mascot.svg" width="480" height="400"
         alt="CloudPlatform 项目宠物「云团」——抱着服务器的云朵精灵">
    <h1>CloudPlatform</h1>
    <p class="subtitle">全球云资源交易平台 — 多云资源聚合、自动交付与统一计费</p>
    <nav class="links" aria-label="快捷入口">
      <a class="primary" href="/apidoc">API 文档</a>
      <a href="/health">服务健康检查</a>
    </nav>
    <footer>CloudPlatform &middot; 云资源交易与托管服务</footer>
  </main>
</body>
</html>
