  <rect x="0.5" y="0.5" width="479" height="399" rx="26" fill="none" stroke="#c7ddf7"/></g><g class="ex-face"><ellipse cx="240" cy="192" rx="62" ry="46" fill="#E8F1FD"/><path d="M 199.65,149.85 L 219.15,157.65" stroke="#1E3A8A" stroke-width="2.28" stroke-linecap="round"/><path d="M 280.35,149.85 L 260.85,157.65" stroke="#1E3A8A" stroke-width="2.28" stroke-linecap="round"/><ellipse cx="212" cy="170" rx="13" ry="8.58" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.08"/><ellipse cx="212" cy="170" rx="6.24" ry="4.72" fill="#1E3A8A"/><circle cx="209.14" cy="167.6" r="2.6" fill="#FFFFFF"/><ellipse cx="268" cy="170" rx="13" ry="8.58" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.08"/><ellipse cx="268" cy="170" rx="6.24" ry="4.72" fill="#1E3A8A"/><circle cx="265.14" cy="167.6" r="2.6" fill="#FFFFFF"/><rect x="225.05" y="192.05" width="29.9" height="12.64" rx="2.62" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="1.66"/><path d="M 231.03,192.05 L 231.03,204.68" stroke="#1E3A8A" stroke-width="1" opacity=".55"/><path d="M 237.01,192.05 L 237.01,204.68" stroke="#1E3A8A" stroke-width="1" opacity=".55"/><path d="M 242.99,192.05 L 242.99,204.68" stroke="#1E3A8A" stroke-width="1" opacity=".55"/><path d="M 248.97,192.05 L 248.97,204.68" stroke="#1E3A8A" stroke-width="1" opacity=".55"/><path d="M 225.05,198.6 L 254.95,198.6" stroke="#1E3A8A" stroke-width="1.04" opacity=".55"/><g class="ex-anim-pulse"><path d="M 281.31,129.07 L 283.8,136.97 L 291.71,139.47 L 283.8,141.96 L 281.31,149.87 L 278.81,141.96 L 270.91,139.47 L 278.81,136.97 Z" fill="#EF4444"/></g><g transform="translate(235.78 120.61)"><circle class="ex-anim-steam" style="animation-delay:0.0s" r="4.65" fill="#D7DEE8" opacity=".72"/></g><g transform="translate(240 117.65)"><circle class="ex-anim-steam" style="animation-delay:0.28s" r="5.92" fill="#D7DEE8" opacity=".72"/></g><g transform="translate(244.22 121.03)"><circle class="ex-anim-steam" style="animation-delay:0.56s" r="4.23" fill="#D7DEE8" opacity=".72"/></g><circle class="ex-anim-pulse" cx="240" cy="170" r="53.88" fill="none" stroke="#EF4444" stroke-width="4.85" opacity=".35"/></g></g></svg>