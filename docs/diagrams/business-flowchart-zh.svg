<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="userGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="orderGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fefce8"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="payGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="provGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="mgmtGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#e9d5ff"/></linearGradient>
    <linearGradient id="secBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
    <marker id="arrDash" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/></marker>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc" rx="12"/>
  <rect x="0" y="0" width="1200" height="56" fill="url(#hdr)" rx="12"/>
  <rect x="0" y="12" width="1200" height="44" fill="url(#hdr)"/>
  <text x="600" y="37" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Cloud Platform — 核心业务流程图</text>

  <!-- Phase labels -->
  <g font-size="12" text-anchor="middle">
    <rect x="30" y="72" width="215" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="137" y="87" fill="#1e40af" font-weight="bold">用户操作</text>
    <rect x="275" y="72" width="215" height="22" rx="4" fill="#fefce8" stroke="#fde68a"/>
    <text x="382" y="87" fill="#a16207" font-weight="bold">订单处理</text>
    <rect x="520" y="72" width="215" height="22" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="627" y="87" fill="#b91c1c" font-weight="bold">支付结算</text>
    <rect x="765" y="72" width="215" height="22" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="872" y="87" fill="#15803d" font-weight="bold">自动交付</text>
    <rect x="1010" y="72" width="160" height="22" rx="4" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="1090" y="87" fill="#7c3aed" font-weight="bold">售后管理</text>
  </g>

  <g filter="url(#sh)">
    <!-- Row 1: Main flow -->
    <rect x="50" y="110" width="180" height="62" rx="10" fill="url(#userGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="140" y="137" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold">注册 / 登录</text>
    <text x="140" y="157" text-anchor="middle" fill="#64748b" font-size="11">JWT · Captcha · 加密传输</text>

    <path d="M230,141 L260,141" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="270" y="110" width="180" height="62" rx="10" fill="url(#userGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="360" y="137" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold">浏览 / 选购</text>
    <text x="360" y="157" text-anchor="middle" fill="#64748b" font-size="11">产品搜索 · SKU · 区域定价</text>

    <path d="M450,141 L480,141" stroke="#94a3b8" stroke-width="2"/>

    <rect x="490" y="110" width="180" height="62" rx="10" fill="url(#orderGrad)" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="580" y="137" text-anchor="middle" fill="#92400e" font-size="14" font-weight="bold">提交订单</text>
    <text x="580" y="157" text-anchor="middle" fill="#64748b" font-size="11">购物车 · 优惠券 · 发票</text>

    <path d="M670,141 L700,141" stroke="#94a3b8" stroke-width="2"/>

    <rect x="710" y="110" width="180" height="62" rx="10" fill="url(#payGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="800" y="137" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">选择支付</text>
    <text x="800" y="157" text-anchor="middle" fill="#64748b" font-size="11">Stripe · 多币种 · 路由</text>

    <path d="M890,141 L920,141" stroke="#94a3b8" stroke-width="2"/>

    <rect x="930" y="110" width="180" height="62" rx="10" fill="url(#payGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="1020" y="137" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">支付确认</text>
    <text x="1020" y="157" text-anchor="middle" fill="#64748b" font-size="11">Webhook · 对账 · 审计</text>

    <!-- Arrow down and left -->
    <path d="M1020,172 L1020,210 L580,210 L580,240" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <polygon points="575,235 585,244 580,235 585,226" fill="#94a3b8"/>

    <!-- Row 2: Provisioning -->
    <rect x="490" y="245" width="180" height="62" rx="10" fill="url(#provGrad)" stroke="#86efac" stroke-width="1.5"/>
    <text x="580" y="272" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">资源交付引擎</text>
    <text x="580" y="292" text-anchor="middle" fill="#64748b" font-size="11">Provider 插件 · 队列 · 重试</text>

    <path d="M670,276 L700,276" stroke="#94a3b8" stroke-width="2"/>

    <rect x="710" y="245" width="180" height="62" rx="10" fill="url(#provGrad)" stroke="#86efac" stroke-width="1.5"/>
    <text x="800" y="272" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">VM / 资源创建</text>
    <text x="800" y="292" text-anchor="middle" fill="#64748b" font-size="11">Proxmox · 主机选择 · IP 分配</text>

    <path d="M890,276 L920,276" stroke="#94a3b8" stroke-width="2"/>

    <rect x="930" y="245" width="180" height="62" rx="10" fill="url(#provGrad)" stroke="#86efac" stroke-width="1.5"/>
    <text x="1020" y="272" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">交付完成</text>
    <text x="1020" y="292" text-anchor="middle" fill="#64748b" font-size="11">通知 · 邮件 · VNC 控制台</text>

    <path d="M1020,307 L1020,360 L1090,360 L1090,400" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <polygon points="1085,395 1095,404 1090,395 1095,386" fill="#94a3b8"/>

    <!-- Row 3: After-sales -->
    <rect x="930" y="405" width="180" height="62" rx="10" fill="url(#mgmtGrad)" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1020" y="432" text-anchor="middle" fill="#6b21a8" font-size="14" font-weight="bold">资源管理</text>
    <text x="1020" y="452" text-anchor="middle" fill="#64748b" font-size="11">监控 · 告警 · DNS · 工单</text>

    <path d="M1020,467 L1020,510 L580,510 L580,540" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <polygon points="575,535 585,544 580,535 585,526" fill="#94a3b8"/>

    <!-- Row 4: Renewal -->
    <rect x="490" y="545" width="180" height="62" rx="10" fill="url(#mgmtGrad)" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="580" y="572" text-anchor="middle" fill="#6b21a8" font-size="14" font-weight="bold">续费 / 升级</text>
    <text x="580" y="592" text-anchor="middle" fill="#64748b" font-size="11">自动续费 · 升配 · 降配</text>

    <!-- Back arrow -->
    <path d="M490,576 L260,576 L260,500 L140,500 L140,178" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,3" fill="none"/>
    <polygon points="135,173 145,182 140,173 145,164" fill="#cbd5e1"/>
    <text x="375" y="568" text-anchor="middle" fill="#94a3b8" font-size="11">循环购买</text>
  </g>

  <!-- Event-driven annotations -->
  <g font-size="11" fill="#64748b">
    <text x="40" y="330" font-weight="bold" fill="#475569">事件驱动链路：</text>
    <text x="45" y="348">支付成功 → OrderPaid → 交付引擎</text>
    <text x="45" y="366">交付完成 → ResourceReady → 通知用户</text>
    <text x="45" y="384">资源到期 → ResourceExpiring → 续费提醒</text>
    <text x="45" y="402">工单创建 → TicketCreated → 分配客服</text>
  </g>

  <!-- Security bar -->
  <g>
    <rect x="0" y="660" width="1200" height="60" fill="url(#secBar)"/>
    <text x="600" y="686" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">全局安全防护：CORS · WAF (45+规则) · SecurityPlugin · GeoBlock</text>
    <text x="600" y="704" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">(31种攻击检测) · AES-256-GCM · 频率限制 · 审计日志 · 二次确认</text>
  </g>
</svg>
