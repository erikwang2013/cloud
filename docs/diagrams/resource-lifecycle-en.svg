<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrGr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <marker id="arrOr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker>
    <marker id="arrGy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1100" height="580" fill="#f8fafc" rx="12"/>
  <rect x="0" y="0" width="1100" height="50" fill="url(#hdr)" rx="12"/><rect x="0" y="12" width="1100" height="38" fill="url(#hdr)"/>
  <text x="550" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">Cloud Platform — Resource Lifecycle</text>

  <g filter="url(#sh)">
    <rect x="45" y="110" width="170" height="75" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="130" y="140" text-anchor="middle" fill="#92400e" font-size="16" font-weight="bold">Pending</text><text x="130" y="160" text-anchor="middle" fill="#b45309" font-size="12">Awaiting Delivery</text><text x="130" y="176" text-anchor="middle" fill="#92400e" font-size="10">Order Paid</text>
    <path d="M215,147 L260,147" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGr)"/><text x="237" y="138" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold">Dispatch</text>
    <rect x="270" y="110" width="170" height="75" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="355" y="140" text-anchor="middle" fill="#1e40af" font-size="16" font-weight="bold">Provisioning</text><text x="355" y="160" text-anchor="middle" fill="#2563eb" font-size="12">Creating Resources</text><text x="355" y="176" text-anchor="middle" fill="#1e40af" font-size="10">Create VM·Attach Disk·Alloc IP</text>
    <path d="M440,147 L485,147" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGr)"/><text x="462" y="138" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold">Success</text>
    <rect x="495" y="110" width="170" height="75" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="580" y="140" text-anchor="middle" fill="#166534" font-size="16" font-weight="bold">Active</text><text x="580" y="160" text-anchor="middle" fill="#15803d" font-size="12">Running</text><text x="580" y="176" text-anchor="middle" fill="#166534" font-size="10">Available·Monitor·VNC·DNS</text>
    <path d="M580,185 L580,230" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOr)"/><text x="595" y="212" fill="#ea580c" font-size="10" font-weight="bold">Manual/Overdue</text>
    <rect x="495" y="240" width="170" height="75" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="580" y="270" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="bold">Suspended</text><text x="580" y="290" text-anchor="middle" fill="#c2410c" font-size="12">Paused</text><text x="580" y="306" text-anchor="middle" fill="#9a3412" font-size="10">Billing Stopped·Data Kept</text>
    <path d="M495,277 L440,277 L440,147" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrGr)"/><text x="432" y="220" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold">Renew</text>
    <path d="M580,315 L580,360" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/><text x="595" y="342" fill="#dc2626" font-size="10" font-weight="bold">Expired</text>
    <rect x="495" y="370" width="170" height="75" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="580" y="400" text-anchor="middle" fill="#991b1b" font-size="16" font-weight="bold">Expired</text><text x="580" y="420" text-anchor="middle" fill="#b91c1c" font-size="12">Grace Period</text><text x="580" y="436" text-anchor="middle" fill="#991b1b" font-size="10">Service Stopped·7-Day Retention</text>
    <path d="M665,407 L710,407" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/><text x="687" y="398" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">Cleanup</text>
    <rect x="720" y="370" width="170" height="75" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="805" y="400" text-anchor="middle" fill="#475569" font-size="16" font-weight="bold">Terminated</text><text x="805" y="420" text-anchor="middle" fill="#64748b" font-size="12">Destroyed</text><text x="805" y="436" text-anchor="middle" fill="#475569" font-size="10">Resources Released·Permanent</text>
    <path d="M355,185 L355,340 L430,340 L430,407" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrRed)"/><text x="370" y="268" fill="#dc2626" font-size="10" font-weight="bold">Provision Failed</text>
    <path d="M665,147 L720,147 L720,370" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrGy)"/><text x="810" y="210" text-anchor="middle" fill="#64748b" font-size="10">Admin Delete</text>
  </g>

  <g>
    <rect x="45" y="240" width="370" height="205" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="264" fill="#334155" font-size="13" font-weight="bold">Lifecycle Events</text><line x1="60" y1="274" x2="400" y2="274" stroke="#e2e8f0"/>
    <g font-size="11" fill="#475569">
      <text x="60" y="296"><tspan fill="#16a34a" font-weight="bold">OrderPaid</tspan> → Create ProvisionTask (status=pending)</text>
      <text x="60" y="316"><tspan fill="#2563eb" font-weight="bold">ProvisionStarted</tspan> → ProviderFactory resolves Provider</text>
      <text x="60" y="336"><tspan fill="#16a34a" font-weight="bold">ResourceReady</tspan> → Create Resource/Disk records, notify user</text>
      <text x="60" y="356"><tspan fill="#ea580c" font-weight="bold">ResourceSuspended</tspan> → Stop billing, retain data &amp; config</text>
      <text x="60" y="376"><tspan fill="#dc2626" font-weight="bold">ResourceExpiring</tspan> → Send renewal reminders 7/3/1 days ahead</text>
      <text x="60" y="396"><tspan fill="#dc2626" font-weight="bold">ResourceExpired</tspan> → Stop service, auto-terminate after 7 days</text>
      <text x="60" y="416"><tspan fill="#64748b" font-weight="bold">ResourceTerminated</tspan> → Clean VM/Disk/IP, audit trail</text>
      <text x="60" y="436"><tspan fill="#dc2626" font-weight="bold">ProvisionFailed</tspan> → Exponential backoff retry (6x), alert</text>
    </g>
  </g>

  <rect x="720" y="475" width="340" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/><text x="740" y="496" fill="#991b1b" font-size="11" font-weight="bold">Retry Strategy</text><text x="740" y="514" fill="#b91c1c" font-size="11">1min → 5min → 15min → 1h → 6h → 24h (max 6 retries)</text>

  <g font-size="10" fill="#64748b">
    <text x="45" y="495" font-weight="bold" fill="#334155">States:</text><text x="130" y="495">7 states + 10 lifecycle events</text>
    <text x="45" y="512" font-weight="bold" fill="#334155">Delivery:</text><text x="130" y="512">Event-driven · Async Queue · Exponential Backoff · Failure Alert</text>
    <text x="45" y="529" font-weight="bold" fill="#334155">Providers:</text><text x="130" y="529">kvm-server (Rust gRPC self-op) · Proxmox · Aliyun/AWS (Planned)</text>
  </g>
<g opacity="0.5">
    <text x="1084" y="565" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="rgba(0,0,0,0.18)">https://erik.xyz</text>
  </g>
</svg>
