<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="userGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="orderGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fefce8"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="payGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef2f2"/><stop offset="100%" stop-color="#fecaca"/></linearGradient>
    <linearGradient id="provGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="mgmtGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#e9d5ff"/></linearGradient>
    <linearGradient id="secBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc" rx="12"/>
  <rect x="0" y="0" width="1200" height="56" fill="url(#hdr)" rx="12"/>
  <rect x="0" y="12" width="1200" height="44" fill="url(#hdr)"/>
  <text x="600" y="37" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">Cloud Platform — 多币种结算流程图</text>

  <!-- Phase labels (left column) -->
  <g font-size="13" text-anchor="middle">
    <rect x="30" y="110" width="110" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="85" y="145" fill="#1e40af" font-weight="bold">① 定价下单</text>
    <rect x="30" y="230" width="110" height="60" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="85" y="265" fill="#b91c1c" font-weight="bold">② 支付收款</text>
    <rect x="30" y="350" width="110" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="85" y="385" fill="#15803d" font-weight="bold">③ 结算入账</text>
  </g>

  <g filter="url(#sh)">
    <!-- Row 1: Pricing & Order -->
    <rect x="170" y="110" width="300" height="60" rx="10" fill="url(#userGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="320" y="137" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold">币种设置</text>
    <text x="320" y="157" text-anchor="middle" fill="#64748b" font-size="11">注册默认 USD + CNY 双币种余额账户</text>

    <path d="M470,140 L500,140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="510" y="110" width="300" height="60" rx="10" fill="url(#userGrad)" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="660" y="137" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="bold">选购定价</text>
    <text x="660" y="157" text-anchor="middle" fill="#64748b" font-size="11">(SKU, 区域, 币种) 三级定价 · 按首选币种展示</text>

    <path d="M810,140 L840,140" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="850" y="110" width="300" height="60" rx="10" fill="url(#orderGrad)" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="1000" y="137" text-anchor="middle" fill="#92400e" font-size="14" font-weight="bold">提交订单</text>
    <text x="1000" y="157" text-anchor="middle" fill="#64748b" font-size="11">记录订单币种 + 汇率快照 (exchange_rate)</text>

    <!-- Row1 -> Row2 -->
    <path d="M1000,170 L1000,200 L320,200 L320,230" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- Row 2: Payment -->
    <rect x="170" y="230" width="300" height="60" rx="10" fill="url(#payGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="320" y="257" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">支付路由</text>
    <text x="320" y="277" text-anchor="middle" fill="#64748b" font-size="11">按 币种/金额/区域 过滤可用通道</text>

    <path d="M470,260 L500,260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="510" y="230" width="300" height="60" rx="10" fill="url(#payGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="660" y="257" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">Stripe 收款</text>
    <text x="660" y="277" text-anchor="middle" fill="#64748b" font-size="11">PaymentIntent 按订单币种 · 零小数币种处理</text>

    <path d="M810,260 L840,260" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="850" y="230" width="300" height="60" rx="10" fill="url(#payGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="1000" y="257" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">回调入账</text>
    <text x="1000" y="277" text-anchor="middle" fill="#64748b" font-size="11">Webhook 校验金额+币种 · 交易记录含汇率</text>

    <!-- Row2 -> Row3 -->
    <path d="M1000,290 L1000,320 L320,320 L320,350" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- Row 3: Settlement -->
    <rect x="170" y="350" width="300" height="60" rx="10" fill="url(#provGrad)" stroke="#86efac" stroke-width="1.5"/>
    <text x="320" y="377" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">余额入账</text>
    <text x="320" y="397" text-anchor="middle" fill="#64748b" font-size="11">UserBalance 按币种入账 · 冻结/解冻</text>

    <path d="M470,380 L500,380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="510" y="350" width="300" height="60" rx="10" fill="url(#provGrad)" stroke="#86efac" stroke-width="1.5"/>
    <text x="660" y="377" text-anchor="middle" fill="#166534" font-size="14" font-weight="bold">供应商结算</text>
    <text x="660" y="397" text-anchor="middle" fill="#64748b" font-size="11">周期汇总 total_sales / commission / payable</text>

    <path d="M810,380 L840,380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="850" y="350" width="300" height="60" rx="10" fill="url(#mgmtGrad)" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1000" y="377" text-anchor="middle" fill="#6b21a8" font-size="14" font-weight="bold">营收报表</text>
    <text x="1000" y="397" text-anchor="middle" fill="#64748b" font-size="11">营收 / 区域 / 供应商报表按币种统计</text>
  </g>

  <!-- Key mechanisms -->
  <g font-size="11" fill="#64748b">
    <rect x="30" y="460" width="1140" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="50" y="488" font-weight="bold" fill="#475569" font-size="12">关键机制：</text>
    <text x="50" y="512">· 汇率同步：ExchangeRateSync 定时任务拉取汇率 → Redis 缓存（30 分钟 TTL）</text>
    <text x="50" y="536">· 分币种隔离：uk_user_currency (user_id, currency) / uk_sku_region_currency (sku_id, region_id, currency) 唯一约束</text>
    <text x="50" y="560">· 汇率快照：订单与支付交易均记录下单时 exchange_rate，保证结算可追溯</text>
    <text x="50" y="584">· 币种范围：任意 Stripe 支持的币种（USD / CNY / JPY / KRW / VND 等），内置 16 种零小数币种处理</text>
    <text x="50" y="608">· 支付通道：erik_payment_channels.currency_support 声明币种白名单，PaymentRouter 动态过滤，无需改代码上下线</text>
  </g>

  <!-- Security bar -->
  <g>
    <rect x="0" y="674" width="1200" height="46" fill="url(#secBar)"/>
    <text x="600" y="703" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">
      全局安全防护：CORS · WAF (45+规则) · SecurityPlugin (31种攻击检测) · GeoBlock · AES-256-GCM · 频率限制 · 审计日志 · 二次确认
    </text>
  </g>
</svg>
