<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrGr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/></marker>
    <marker id="arrOr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/></marker>
    <marker id="arrGy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1100" height="580" fill="#f8fafc" rx="12"/>
  <rect x="0" y="0" width="1100" height="50" fill="url(#hdr)" rx="12"/><rect x="0" y="12" width="1100" height="38" fill="url(#hdr)"/>
  <text x="550" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">Cloud Platform — Resource Lifecycle</text>

  <g filter="url(#sh)">
    <rect x="45" y="110" width="170" height="75" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="130" y="140" text-anchor="middle" fill="#92400e" font-size="16" font-weight="bold">Pending</text><text x="130" y="160" text-anchor="middle" fill="#b45309" font-size="12">Awaiting delivery</text><text x="130" y="176" text-anchor="middle" fill="#92400e" font-size="10">Order paid</text>
    <path d="M215,147 L260,147" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGr)"/><text x="237" y="138" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold">trigger</text>
    <rect x="270" y="110" width="170" height="75" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="355" y="140" text-anchor="middle" fill="#1e40af" font-size="16" font-weight="bold">Provisioning</text><text x="355" y="160" text-anchor="middle" fill="#2563eb" font-size="12">Provisioning</text><text x="355" y="176" text-anchor="middle" fill="#1e40af" font-size="10">create VM · attach disk · assign IP</text>
    <path d="M440,147 L485,147" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGr)"/><text x="462" y="138" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold">created</text>
    <rect x="495" y="110" width="170" height="75" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="580" y="140" text-anchor="middle" fill="#166534" font-size="16" font-weight="bold">Active</text><text x="580" y="160" text-anchor="middle" fill="#15803d" font-size="12">Running</text><text x="580" y="176" text-anchor="middle" fill="#166534" font-size="10">usable · monitoring · VNC · DNS</text>
    <path d="M580,185 L580,230" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrOr)"/><text x="595" y="212" fill="#ea580c" font-size="10" font-weight="bold">manual / arrears</text>
    <rect x="495" y="240" width="170" height="75" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text x="580" y="270" text-anchor="middle" fill="#9a3412" font-size="16" font-weight="bold">Suspended</text><text x="580" y="290" text-anchor="middle" fill="#c2410c" font-size="12">Suspended</text><text x="580" y="306" text-anchor="middle" fill="#9a3412" font-size="10">billing paused · data kept</text>
    <path d="M495,277 L462,277 L462,147 L442,147" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrGr)"/><text x="473" y="218" text-anchor="middle" fill="#16a34a" font-size="10" font-weight="bold">renewed</text>
    <path d="M580,315 L580,360" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/><text x="595" y="342" fill="#dc2626" font-size="10" font-weight="bold">not renewed</text>
    <rect x="495" y="370" width="170" height="75" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="580" y="400" text-anchor="middle" fill="#991b1b" font-size="16" font-weight="bold">Expired</text><text x="580" y="420" text-anchor="middle" fill="#b91c1c" font-size="12">Expired</text><text x="580" y="436" text-anchor="middle" fill="#991b1b" font-size="10">stopped · kept 7 days</text>
    <path d="M665,407 L710,407" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/><text x="687" y="398" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">purge</text>
    <rect x="720" y="370" width="170" height="75" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="805" y="400" text-anchor="middle" fill="#475569" font-size="16" font-weight="bold">Terminated</text><text x="805" y="420" text-anchor="middle" fill="#64748b" font-size="12">Terminated</text><text x="805" y="436" text-anchor="middle" fill="#475569" font-size="10">released · irreversible</text>
    <path d="M355,185 L355,215 L432,215 L432,407 L493,407" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrRed)"/><text x="462" y="399" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="bold">failed</text>
    <path d="M665,147 L720,147 L720,370" stroke="#64748b" stroke-width="2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrGy)"/><text x="810" y="210" text-anchor="middle" fill="#64748b" font-size="10">manual delete (admin)</text>
  </g>

  <g>
    <rect x="45" y="240" width="350" height="205" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="60" y="264" fill="#334155" font-size="13" font-weight="bold">Lifecycle Events</text><line x1="60" y1="274" x2="380" y2="274" stroke="#e2e8f0"/>
    <g font-size="11" fill="#475569">
      <text x="60" y="296"><tspan fill="#16a34a" font-weight="bold">OrderPaid</tspan> → creates ProvisionTask (status=pending)</text>
      <text x="60" y="316"><tspan fill="#2563eb" font-weight="bold">ProvisionStarted</tspan> → ProviderFactory resolves provider</text>
      <text x="60" y="336"><tspan fill="#16a34a" font-weight="bold">ResourceReady</tspan> → creates Resource/Disk rows, notifies user</text>
      <text x="60" y="356"><tspan fill="#ea580c" font-weight="bold">ResourceSuspended</tspan> → pauses billing, keeps data &amp; config</text>
      <text x="60" y="376"><tspan fill="#dc2626" font-weight="bold">ResourceExpiring</tspan> → renewal reminders at T-7/3/1 days</text>
      <text x="60" y="396"><tspan fill="#dc2626" font-weight="bold">ResourceExpired</tspan> → stops service, auto-terminates after 7 days</text>
      <text x="60" y="416"><tspan fill="#64748b" font-weight="bold">ResourceTerminated</tspan> → purges VM / disk / IP, writes audit log</text>
      <text x="60" y="436"><tspan fill="#dc2626" font-weight="bold">ProvisionFailed</tspan> → exponential backoff (6 tries), alerts on failure</text>
    </g>
  </g>

  <rect x="720" y="475" width="340" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/><text x="740" y="496" fill="#991b1b" font-size="11" font-weight="bold">Delivery Retry Policy</text><text x="740" y="514" fill="#b91c1c" font-size="11">1min → 5min → 15min → 1h → 6h → 24h (max 6 tries)</text>

  <g font-size="10" fill="#64748b">
    <text x="45" y="495" font-weight="bold" fill="#334155">States:</text><text x="130" y="495">6 states + 8 lifecycle events</text>
    <text x="45" y="512" font-weight="bold" fill="#334155">Delivery mode:</text><text x="130" y="512">event-driven · async queues · exponential backoff · failure alerts</text>
    <text x="45" y="529" font-weight="bold" fill="#334155">Providers:</text><text x="130" y="529">kvm-server (Rust gRPC, first-party) · Proxmox · Aliyun/AWS (planned)</text>
  </g>
<g opacity="0.5">
    <text x="1084" y="565" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="rgba(0,0,0,0.18)">https://erik.xyz</text>
  </g>
</svg>
