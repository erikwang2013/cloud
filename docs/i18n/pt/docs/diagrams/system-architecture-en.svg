<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 940" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3b82f6"/></marker>
  </defs>

  <rect width="1180" height="940" fill="#f8fafc" rx="12"/>
  <rect x="0" y="0" width="1180" height="50" fill="url(#hdr)" rx="12"/>
  <rect x="0" y="12" width="1180" height="38" fill="url(#hdr)"/>
  <text x="590" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">Cloud Platform — System Architecture</text>

  <!-- ══ 客户端层 ══ -->
  <g filter="url(#sh)">
    <rect x="30" y="64" width="1120" height="78" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="50" y="85" fill="#6b21a8" font-size="13" font-weight="bold">Client Layer — Multi-Platform Access</text>
    <rect x="50" y="95" width="170" height="36" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="135" y="118" text-anchor="middle" fill="#6b21a8" font-size="11.5" font-weight="bold">Flutter Mobile</text>
    <rect x="232" y="95" width="170" height="36" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="317" y="118" text-anchor="middle" fill="#6b21a8" font-size="11.5" font-weight="bold">Flutter Desktop</text>
    <rect x="414" y="95" width="170" height="36" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="499" y="118" text-anchor="middle" fill="#6b21a8" font-size="11.5" font-weight="bold">Flutter Web</text>
    <rect x="596" y="95" width="170" height="36" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="681" y="118" text-anchor="middle" fill="#6b21a8" font-size="11.5" font-weight="bold">HarmonyOS ArkTS</text>
    <rect x="778" y="95" width="170" height="36" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="863" y="118" text-anchor="middle" fill="#6b21a8" font-size="11.5" font-weight="bold">Admin Panel Web</text>
    <rect x="960" y="95" width="170" height="36" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="1045" y="118" text-anchor="middle" fill="#6b21a8" font-size="11.5" font-weight="bold">Third-Party Suppliers</text>
  </g>
  <path d="M590,142 L590,166" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="602" y="158" fill="#64748b" font-size="10">HTTPS + JWT | WebSocket Upgrade | X-Client-Platform</text>

  <!-- ══ 边缘层 ══ -->
  <g filter="url(#sh)">
    <rect x="30" y="168" width="1120" height="74" rx="8" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
    <text x="50" y="189" fill="#0e7490" font-size="13" font-weight="bold">Edge Layer — Ingress Protection &amp; Reverse Proxy</text>
    <rect x="50" y="199" width="530" height="32" rx="6" fill="#cffafe" stroke="#22d3ee"/>
    <text x="315" y="220" text-anchor="middle" fill="#0e7490" font-size="11.5" font-weight="bold">Cloudflare CDN — DDoS mitigation · bot detection · edge cache</text>
    <rect x="600" y="199" width="530" height="32" rx="6" fill="#cffafe" stroke="#22d3ee"/>
    <text x="865" y="220" text-anchor="middle" fill="#0e7490" font-size="11.5" font-weight="bold">Nginx ×2 — SSL termination · gzip · limit_req · WS upgrade</text>
  </g>
  <path d="M590,242 L590,266" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="602" y="258" fill="#64748b" font-size="10">Reverse proxy → long-running multi-process (Workerman)</text>

  <!-- ══ 业务服务层 ══ -->
  <g filter="url(#sh)">
    <rect x="30" y="268" width="1120" height="300" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="50" y="289" fill="#1e40af" font-size="13" font-weight="bold">Service Layer — Two webman Instances (shared MySQL, isolated failure domains)</text>

    <!-- service -->
    <rect x="46" y="300" width="700" height="252" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="62" y="321" fill="#1e3a8a" font-size="12.5" font-weight="bold">webman service　:8787</text>
    <text x="730" y="321" text-anchor="end" fill="#1d4ed8" font-size="10">User API · Supplier API · WebSocket · Queues · Cron</text>

    <text x="62" y="341" fill="#1d4ed8" font-size="10.5" font-weight="bold">Global middleware chain (12 items, in order)</text>
    <g font-size="9" font-weight="bold" fill="#0e7490" text-anchor="middle">
      <rect x="62" y="347" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="114" y="362">Version</text>
      <rect x="174" y="347" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="226" y="362">CORS</text>
      <rect x="286" y="347" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="338" y="362">SecurityHeaders</text>
      <rect x="398" y="347" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="450" y="362">ClientPlatform</text>
      <rect x="510" y="347" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="562" y="362">GeoBlock</text>
      <rect x="622" y="347" width="108" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="676" y="362">WAF</text>
      <rect x="62" y="374" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="114" y="389">SecurityPlugin</text>
      <rect x="174" y="374" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="226" y="389">RateLimit</text>
      <rect x="286" y="374" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="338" y="389">Locale</text>
      <rect x="398" y="374" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="450" y="389">Metrics</text>
      <rect x="510" y="374" width="104" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="562" y="389">Hashid</text>
      <rect x="622" y="374" width="108" height="22" rx="4" fill="#cffafe" stroke="#22d3ee"/><text x="676" y="389">Maintenance</text>
    </g>
    <text x="62" y="409" fill="#64748b" font-size="9">Route middleware: Encryption (AES-256-GCM) · Auth (JWT) · Confirmation · AdminRole (RBAC) · SupplierApiKey · InternalToken</text>

    <text x="62" y="430" fill="#1d4ed8" font-size="10.5" font-weight="bold">Business modules (23)</text>
    <g fill="#1e40af" font-size="10">
      <text x="62" y="448">User · Product · Order · Payment · Provisioning · Supplier · Ticket · Domain</text>
      <text x="62" y="464">SSL · Storage · CDN · Billing · Affiliate · Monitor · Notification · Report</text>
      <text x="62" y="480">Admin · Captcha · Cron · WebSocket · GraphQL · Webhook · Common</text>
    </g>

    <rect x="62" y="492" width="668" height="46" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="74" y="509" fill="#1e3a8a" font-size="10" font-weight="bold">Process model</text>
    <text x="74" y="525" fill="#334155" font-size="9.5">HTTP Worker ×8　│　Queue Worker：provisioning ×2 · email ×5 · sms ×10 · push ×20　│　WebSocket :8282 ×2　│　Cron Timer ×1</text>

    <!-- admin -->
    <rect x="762" y="300" width="372" height="252" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
    <text x="778" y="321" fill="#9f1239" font-size="12.5" font-weight="bold">webman admin　:8788</text>
    <text x="1118" y="321" text-anchor="end" fill="#be123c" font-size="10">Admin panel</text>

    <rect x="778" y="333" width="340" height="42" rx="6" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="948" y="351" text-anchor="middle" fill="#9f1239" font-size="10.5" font-weight="bold">webman-admin + Layui</text>
    <text x="948" y="366" text-anchor="middle" fill="#be123c" font-size="9.5">54 controllers · 46 models · 13 menu groups</text>

    <text x="778" y="395" fill="#9f1239" font-size="10.5" font-weight="bold">Middleware chain</text>
    <rect x="778" y="402" width="164" height="24" rx="4" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="860" y="418" text-anchor="middle" fill="#9f1239" font-size="9.5" font-weight="bold">WafMiddleware</text>
    <path d="M942,414 L954,414" stroke="#fb7185" stroke-width="2" marker-end="url(#arrD)"/>
    <rect x="958" y="402" width="160" height="24" rx="4" fill="#ffe4e6" stroke="#fda4af"/>
    <text x="1038" y="418" text-anchor="middle" fill="#9f1239" font-size="9.5" font-weight="bold">AccessControl (ACL)</text>

    <text x="778" y="447" fill="#9f1239" font-size="10.5" font-weight="bold">Process model</text>
    <text x="778" y="463" fill="#334155" font-size="9.5">HTTP Worker × 4</text>

    <rect x="778" y="476" width="340" height="62" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="790" y="493" fill="#9f1239" font-size="10" font-weight="bold">Isolation</text>
    <text x="790" y="509" fill="#334155" font-size="9.5">Separate instance, port and process pool;</text>
    <text x="790" y="524" fill="#334155" font-size="9.5">admin traffic never affects user traffic; same MySQL.</text>
  </g>
  <path d="M590,570 L590,594" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrD)"/>
  <text x="602" y="586" fill="#64748b" font-size="10">Eloquent ORM | Redis cache/queue | Scout full-text search</text>

  <!-- ══ 数据层 ══ -->
  <g filter="url(#sh)">
    <rect x="30" y="596" width="1120" height="92" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="50" y="617" fill="#047857" font-size="13" font-weight="bold">Data Layer — Storage &amp; Search</text>
    <rect x="50" y="627" width="358" height="48" rx="6" fill="#d1fae5" stroke="#34d399"/>
    <text x="229" y="647" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="bold">MySQL 8.0</text>
    <text x="229" y="664" text-anchor="middle" fill="#059669" font-size="9.5">cloud_platform primary + audit DB (dual connection) · 46 tables</text>
    <rect x="420" y="627" width="358" height="48" rx="6" fill="#d1fae5" stroke="#34d399"/>
    <text x="599" y="647" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="bold">Redis 7</text>
    <text x="599" y="664" text-anchor="middle" fill="#059669" font-size="9.5">cache · queue · session · rate-limit buckets · distributed locks</text>
    <rect x="790" y="627" width="340" height="48" rx="6" fill="#d1fae5" stroke="#34d399"/>
    <text x="960" y="647" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="bold">Elasticsearch 8.x</text>
    <text x="960" y="664" text-anchor="middle" fill="#059669" font-size="9.5">IK-tokenized full-text search (falls back to SQL LIKE)</text>
  </g>
  <path d="M590,692 L590,716" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="602" y="708" fill="#2563eb" font-size="10">gRPC :50051 (etcd service discovery)</text>

  <!-- ══ 交付链路 ══ -->
  <g filter="url(#sh)">
    <rect x="30" y="718" width="1120" height="94" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="50" y="739" fill="#92400e" font-size="13" font-weight="bold">Provisioning Layer — First-Party Bare-Metal Supply</text>
    <rect x="50" y="749" width="500" height="50" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="300" y="770" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="bold">kvm-server (Rust · gRPC :50051)</text>
    <text x="300" y="787" text-anchor="middle" fill="#b45309" font-size="9.5">e-cat / etcd discovery · mock driver (real libvirt driver in Phase 2)</text>
    <path d="M556,774 L594,774" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrD)"/>
    <text x="575" y="766" text-anchor="middle" fill="#b45309" font-size="9">API</text>
    <rect x="600" y="749" width="530" height="50" rx="6" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="865" y="770" text-anchor="middle" fill="#92400e" font-size="11.5" font-weight="bold">Proxmox VE API (:8006)</text>
    <text x="865" y="787" text-anchor="middle" fill="#b45309" font-size="9.5">KVM / QEMU · host pool · IP pool · disk pool</text>
  </g>

  <!-- ══ 外部服务 ══ -->
  <g filter="url(#sh)">
    <rect x="30" y="828" width="1120" height="72" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="50" y="849" fill="#334155" font-size="13" font-weight="bold">External Services — Third-Party Integrations</text>
    <g font-size="9.5" fill="#475569" text-anchor="middle">
      <rect x="50" y="859" width="128" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="114" y="876">Stripe Payments</text>
      <rect x="188" y="859" width="128" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="252" y="876">Twilio SMS</text>
      <rect x="326" y="859" width="128" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="390" y="876">Firebase Push</text>
      <rect x="464" y="859" width="128" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="528" y="876">AWS S3</text>
      <rect x="602" y="859" width="128" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="666" y="876">Cloudflare CDN</text>
      <rect x="740" y="859" width="128" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="804" y="876">Domain Registrars</text>
      <rect x="878" y="859" width="128" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="942" y="876">SSL / ACME</text>
      <rect x="1016" y="859" width="114" height="26" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="1073" y="876">Google / Apple</text>
    </g>
  </g>

  <g opacity="0.5">
    <text x="1164" y="928" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="rgba(0,0,0,0.18)">https://erik.xyz</text>
  </g>
</svg>
