<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3b82f6"/></marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ea580c"/></marker>
  </defs>

  <rect width="1180" height="860" fill="#f8fafc" rx="12"/>
  <rect x="0" y="0" width="1180" height="50" fill="url(#hdr)" rx="12"/>
  <rect x="0" y="12" width="1180" height="38" fill="url(#hdr)"/>
  <text x="590" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">Cloud Platform — 功能设计图</text>

  <!-- ═══ 同步请求链路 ═══ -->
  <g filter="url(#sh)">
    <rect x="30" y="66" width="1120" height="176" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="50" y="88" fill="#1e40af" font-size="13" font-weight="bold">同步请求链路 — 读路径与写路径（Controller → Service → Model）</text>

    <rect x="41" y="102" width="168" height="122" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="125" y="126" text-anchor="middle" fill="#6b21a8" font-size="12" font-weight="bold">客户端</text>
    <text x="125" y="148" text-anchor="middle" fill="#7c3aed" font-size="9.5">Flutter · HarmonyOS</text>
    <text x="125" y="164" text-anchor="middle" fill="#7c3aed" font-size="9.5">管理后台 · 供应商系统</text>
    <text x="125" y="186" text-anchor="middle" fill="#8b5cf6" font-size="9.5">HTTPS + JWT</text>
    <text x="125" y="202" text-anchor="middle" fill="#8b5cf6" font-size="9.5">X-Client-Platform</text>

    <rect x="227" y="102" width="168" height="122" rx="7" fill="#cffafe" stroke="#22d3ee"/>
    <text x="311" y="126" text-anchor="middle" fill="#0e7490" font-size="12" font-weight="bold">API 网关</text>
    <text x="311" y="148" text-anchor="middle" fill="#0891b2" font-size="9.5">12 项全局中间件</text>
    <text x="311" y="164" text-anchor="middle" fill="#0891b2" font-size="9.5">版本 / WAF / 限流</text>
    <text x="311" y="186" text-anchor="middle" fill="#0891b2" font-size="9.5">AES-256-GCM 传输加密</text>
    <text x="311" y="202" text-anchor="middle" fill="#0891b2" font-size="9.5">地域封锁 · 维护模式</text>

    <rect x="413" y="102" width="168" height="122" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="497" y="126" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Controller</text>
    <text x="497" y="148" text-anchor="middle" fill="#2563eb" font-size="9.5">参数校验</text>
    <text x="497" y="164" text-anchor="middle" fill="#2563eb" font-size="9.5">Hashid 解码为真实 ID</text>
    <text x="497" y="186" text-anchor="middle" fill="#2563eb" font-size="9.5">RBAC / ACL 权限</text>
    <text x="497" y="202" text-anchor="middle" fill="#2563eb" font-size="9.5">统一 Response 封装</text>

    <rect x="599" y="102" width="168" height="122" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="683" y="126" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Service</text>
    <text x="683" y="148" text-anchor="middle" fill="#2563eb" font-size="9.5">业务编排 · 事务边界</text>
    <text x="683" y="164" text-anchor="middle" fill="#2563eb" font-size="9.5">金额一律 bcmath</text>
    <text x="683" y="186" text-anchor="middle" fill="#2563eb" font-size="9.5">舍入单点 Money::bcround</text>
    <text x="683" y="202" text-anchor="middle" fill="#2563eb" font-size="9.5">无 HTTP 依赖，可复用</text>

    <rect x="785" y="102" width="168" height="122" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="869" y="126" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">Model</text>
    <text x="869" y="148" text-anchor="middle" fill="#2563eb" font-size="9.5">Eloquent ORM</text>
    <text x="869" y="164" text-anchor="middle" fill="#2563eb" font-size="9.5">雪花 ID 主键</text>
    <text x="869" y="186" text-anchor="middle" fill="#2563eb" font-size="9.5">字段加密 Cast</text>
    <text x="869" y="202" text-anchor="middle" fill="#2563eb" font-size="9.5">关系 · 查询作用域</text>

    <rect x="971" y="102" width="168" height="122" rx="7" fill="#d1fae5" stroke="#34d399"/>
    <text x="1055" y="126" text-anchor="middle" fill="#047857" font-size="12" font-weight="bold">存储与检索</text>
    <text x="1055" y="148" text-anchor="middle" fill="#059669" font-size="9.5">MySQL 主库 + 审计库</text>
    <text x="1055" y="164" text-anchor="middle" fill="#059669" font-size="9.5">Redis 缓存 · 队列 · 锁</text>
    <text x="1055" y="186" text-anchor="middle" fill="#059669" font-size="9.5">Elasticsearch 全文搜索</text>
    <text x="1055" y="202" text-anchor="middle" fill="#059669" font-size="9.5">审计日志独立落库</text>

    <g stroke="#3b82f6" stroke-width="2" marker-end="url(#arrB)">
      <path d="M209,163 L221,163"/>
      <path d="M395,163 L407,163"/>
      <path d="M581,163 L593,163"/>
      <path d="M767,163 L779,163"/>
      <path d="M953,163 L965,163"/>
    </g>
  </g>

  <!-- ═══ 异步事件驱动链路 ═══ -->
  <g filter="url(#sh)">
    <rect x="30" y="258" width="1120" height="176" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="50" y="280" fill="#9a3412" font-size="13" font-weight="bold">异步事件驱动链路 — 资源交付 / 通知 / 结算（模块间解耦的唯一手段）</text>

    <rect x="34" y="294" width="146" height="122" rx="7" fill="#ffedd5" stroke="#fb923c"/>
    <text x="107" y="318" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="bold">领域事件</text>
    <text x="107" y="340" text-anchor="middle" fill="#c2410c" font-size="9">OrderPaid</text>
    <text x="107" y="356" text-anchor="middle" fill="#c2410c" font-size="9">TicketCreated</text>
    <text x="107" y="372" text-anchor="middle" fill="#c2410c" font-size="9">ProvisionFailed</text>
    <text x="107" y="394" text-anchor="middle" fill="#ea580c" font-size="9">app/{Module}/event/</text>

    <rect x="195" y="294" width="146" height="122" rx="7" fill="#ffedd5" stroke="#fb923c"/>
    <text x="268" y="318" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="bold">监听器</text>
    <text x="268" y="340" text-anchor="middle" fill="#c2410c" font-size="9">模块互不引用</text>
    <text x="268" y="356" text-anchor="middle" fill="#c2410c" font-size="9">只在 config/event</text>
    <text x="268" y="372" text-anchor="middle" fill="#c2410c" font-size="9">注册订阅关系</text>
    <text x="268" y="394" text-anchor="middle" fill="#ea580c" font-size="9">app/{Module}/listener/</text>

    <rect x="356" y="294" width="146" height="122" rx="7" fill="#ffedd5" stroke="#fb923c"/>
    <text x="429" y="318" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="bold">队列</text>
    <text x="429" y="340" text-anchor="middle" fill="#c2410c" font-size="9">webman redis-queue</text>
    <text x="429" y="356" text-anchor="middle" fill="#c2410c" font-size="9">provisioning ×2</text>
    <text x="429" y="372" text-anchor="middle" fill="#c2410c" font-size="9">email ×5 · sms ×10</text>
    <text x="429" y="394" text-anchor="middle" fill="#ea580c" font-size="9">push ×20</text>

    <rect x="517" y="294" width="146" height="122" rx="7" fill="#ffedd5" stroke="#fb923c"/>
    <text x="590" y="318" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="bold">消费者</text>
    <text x="590" y="340" text-anchor="middle" fill="#c2410c" font-size="9">指数退避重试</text>
    <text x="590" y="356" text-anchor="middle" fill="#c2410c" font-size="9">1m→5m→15m→1h</text>
    <text x="590" y="372" text-anchor="middle" fill="#c2410c" font-size="9">→6h→24h（最多 6 次）</text>
    <text x="590" y="394" text-anchor="middle" fill="#ea580c" font-size="9">app/{Module}/queue/</text>

    <rect x="678" y="294" width="146" height="122" rx="7" fill="#ffedd5" stroke="#fb923c"/>
    <text x="751" y="318" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="bold">Provider 适配器</text>
    <text x="751" y="340" text-anchor="middle" fill="#c2410c" font-size="9">ProviderFactory 解析</text>
    <text x="751" y="356" text-anchor="middle" fill="#c2410c" font-size="9">Proxmox VE（自营）</text>
    <text x="751" y="372" text-anchor="middle" fill="#c2410c" font-size="9">阿里云 / AWS（规划）</text>
    <text x="751" y="394" text-anchor="middle" fill="#ea580c" font-size="9">app/{Module}/provider/</text>

    <rect x="839" y="294" width="146" height="122" rx="7" fill="#ffedd5" stroke="#fb923c"/>
    <text x="912" y="318" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="bold">结果落库</text>
    <text x="912" y="340" text-anchor="middle" fill="#c2410c" font-size="9">Resource / Disk / IP</text>
    <text x="912" y="356" text-anchor="middle" fill="#c2410c" font-size="9">订单项状态回写</text>
    <text x="912" y="372" text-anchor="middle" fill="#c2410c" font-size="9">生命周期状态机推进</text>
    <text x="912" y="394" text-anchor="middle" fill="#ea580c" font-size="9">审计记录</text>

    <rect x="1000" y="294" width="146" height="122" rx="7" fill="#ffedd5" stroke="#fb923c"/>
    <text x="1073" y="318" text-anchor="middle" fill="#9a3412" font-size="11.5" font-weight="bold">对外通知</text>
    <text x="1073" y="340" text-anchor="middle" fill="#c2410c" font-size="9">WebSocket 实时推送</text>
    <text x="1073" y="356" text-anchor="middle" fill="#c2410c" font-size="9">Webhook 回调</text>
    <text x="1073" y="372" text-anchor="middle" fill="#c2410c" font-size="9">邮件 / 短信 / 推送</text>
    <text x="1073" y="394" text-anchor="middle" fill="#ea580c" font-size="9">站内消息</text>

    <g stroke="#ea580c" stroke-width="2" marker-end="url(#arrO)">
      <path d="M180,355 L189,355"/>
      <path d="M341,355 L350,355"/>
      <path d="M502,355 L511,355"/>
      <path d="M663,355 L672,355"/>
      <path d="M824,355 L833,355"/>
      <path d="M985,355 L994,355"/>
    </g>
  </g>

  <!-- ═══ 横切关注点 ═══ -->
  <g filter="url(#sh)">
    <rect x="30" y="450" width="1120" height="122" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="50" y="472" fill="#5b21b6" font-size="13" font-weight="bold">横切关注点 — 由公共库统一提供，业务模块不重复实现</text>
    <g font-size="9.5" fill="#5b21b6" text-anchor="middle">
      <rect x="34" y="484" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="120" y="500">认证鉴权</text><text x="120" y="512" font-size="8.5" fill="#7c3aed">JWT HS256 · RBAC · ACL</text>
      <rect x="222" y="484" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="308" y="500">加密三层</text><text x="308" y="512" font-size="8.5" fill="#7c3aed">传输 GCM · 字段 Cast · 主密钥</text>
      <rect x="410" y="484" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="496" y="500">ID 体系</text><text x="496" y="512" font-size="8.5" fill="#7c3aed">Snowflake 主键 · Hashid 混淆</text>
      <rect x="598" y="484" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="684" y="500">多语言</text><text x="684" y="512" font-size="8.5" fill="#7c3aed">7 语言 · Locale 中间件</text>
      <rect x="786" y="484" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="872" y="500">可观测性</text><text x="872" y="512" font-size="8.5" fill="#7c3aed">Prometheus · Grafana · 审计日志</text>
      <rect x="974" y="484" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="1060" y="500">安全加固</text><text x="1060" y="512" font-size="8.5" fill="#7c3aed">WAF · 31 种检测 · 二次确认</text>
      <rect x="34" y="526" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="120" y="542">功能开关</text><text x="120" y="554" font-size="8.5" fill="#7c3aed">Feature Flags 灰度</text>
      <rect x="222" y="526" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="308" y="542">人机校验</text><text x="308" y="554" font-size="8.5" fill="#7c3aed">点击验证码 · TOTP 两步验证</text>
      <rect x="410" y="526" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="496" y="542">限流与地域</text><text x="496" y="554" font-size="8.5" fill="#7c3aed">per-IP / per-token 双桶 · GeoIP2</text>
      <rect x="598" y="526" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="684" y="542">响应规范</text><text x="684" y="554" font-size="8.5" fill="#7c3aed">统一封装 · hashid 自动编码</text>
      <rect x="786" y="526" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="872" y="542">日志脱敏</text><text x="872" y="554" font-size="8.5" fill="#7c3aed">LogSanitizer 过滤敏感字段</text>
      <rect x="974" y="526" width="172" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/><text x="1060" y="542">客户端识别</text><text x="1060" y="554" font-size="8.5" fill="#7c3aed">X-Client-Platform 8 平台</text>
    </g>
  </g>

  <!-- ═══ 模块标准分层 ═══ -->
  <g filter="url(#sh)">
    <rect x="30" y="594" width="1120" height="176" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="50" y="616" fill="#047857" font-size="13" font-weight="bold">模块标准分层 — 每个业务模块遵循同一目录约定（app/{Module}/）</text>
    <g text-anchor="middle">
      <rect x="36" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="100" y="652" fill="#047857" font-size="10.5" font-weight="bold">controller/</text>
      <text x="100" y="674" fill="#059669" font-size="8.5">HTTP 层</text>
      <text x="100" y="690" fill="#059669" font-size="8.5">参数校验</text>
      <text x="100" y="706" fill="#059669" font-size="8.5">调用 Service</text>
      <text x="100" y="722" fill="#059669" font-size="8.5">返回 Response</text>
      <text x="100" y="744" fill="#10b981" font-size="8">external/ 子目录</text>

      <rect x="176" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="240" y="652" fill="#047857" font-size="10.5" font-weight="bold">service/</text>
      <text x="240" y="674" fill="#059669" font-size="8.5">业务逻辑</text>
      <text x="240" y="690" fill="#059669" font-size="8.5">无 HTTP 依赖</text>
      <text x="240" y="706" fill="#059669" font-size="8.5">Controller 与</text>
      <text x="240" y="722" fill="#059669" font-size="8.5">Queue Worker 共用</text>
      <text x="240" y="744" fill="#10b981" font-size="8">bcmath 金额计算</text>

      <rect x="316" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="380" y="652" fill="#047857" font-size="10.5" font-weight="bold">model/</text>
      <text x="380" y="674" fill="#059669" font-size="8.5">Eloquent 模型</text>
      <text x="380" y="690" fill="#059669" font-size="8.5">关系定义</text>
      <text x="380" y="706" fill="#059669" font-size="8.5">查询作用域</text>
      <text x="380" y="722" fill="#059669" font-size="8.5">Casts 加解密</text>
      <text x="380" y="744" fill="#10b981" font-size="8">雪花 ID Trait</text>

      <rect x="456" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="520" y="652" fill="#047857" font-size="10.5" font-weight="bold">event/</text>
      <text x="520" y="674" fill="#059669" font-size="8.5">领域事件定义</text>
      <text x="520" y="690" fill="#059669" font-size="8.5">OrderPaid</text>
      <text x="520" y="706" fill="#059669" font-size="8.5">TicketCreated</text>
      <text x="520" y="722" fill="#059669" font-size="8.5">ProvisionFailed</text>
      <text x="520" y="744" fill="#10b981" font-size="8">模块解耦入口</text>

      <rect x="596" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="660" y="652" fill="#047857" font-size="10.5" font-weight="bold">listener/</text>
      <text x="660" y="674" fill="#059669" font-size="8.5">事件监听器</text>
      <text x="660" y="690" fill="#059669" font-size="8.5">交付触发</text>
      <text x="660" y="706" fill="#059669" font-size="8.5">WebSocket 推送</text>
      <text x="660" y="722" fill="#059669" font-size="8.5">分佣入账</text>
      <text x="660" y="744" fill="#10b981" font-size="8">config/event.php</text>

      <rect x="736" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="800" y="652" fill="#047857" font-size="10.5" font-weight="bold">provider/</text>
      <text x="800" y="674" fill="#059669" font-size="8.5">云厂商适配器</text>
      <text x="800" y="690" fill="#059669" font-size="8.5">ProviderFactory</text>
      <text x="800" y="706" fill="#059669" font-size="8.5">按 provider 解析</text>
      <text x="800" y="722" fill="#059669" font-size="8.5">统一交付接口</text>
      <text x="800" y="744" fill="#10b981" font-size="8">新增厂商只加一类</text>

      <rect x="876" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="940" y="652" fill="#047857" font-size="10.5" font-weight="bold">queue/</text>
      <text x="940" y="674" fill="#059669" font-size="8.5">队列消费者</text>
      <text x="940" y="690" fill="#059669" font-size="8.5">ProvisionWorker</text>
      <text x="940" y="706" fill="#059669" font-size="8.5">EmailSender</text>
      <text x="940" y="722" fill="#059669" font-size="8.5">SmsSender / PushSender</text>
      <text x="940" y="744" fill="#10b981" font-size="8">重试与失败告警</text>

      <rect x="1016" y="630" width="128" height="126" rx="6" fill="#d1fae5" stroke="#34d399"/>
      <text x="1080" y="652" fill="#047857" font-size="10.5" font-weight="bold">cron/</text>
      <text x="1080" y="674" fill="#059669" font-size="8.5">定时任务</text>
      <text x="1080" y="690" fill="#059669" font-size="8.5">ExpirationCheck</text>
      <text x="1080" y="706" fill="#059669" font-size="8.5">ExchangeRateSync</text>
      <text x="1080" y="722" fill="#059669" font-size="8.5">SupplierSettlement</text>
      <text x="1080" y="744" fill="#10b981" font-size="8">CronRunner 调度</text>
    </g>
  </g>

  <g opacity="0.5">
    <text x="1164" y="848" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="rgba(0,0,0,0.18)">https://erik.xyz</text>
  </g>
</svg>
