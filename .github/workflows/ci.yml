name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check admin PHP syntax
        run: find admin/app admin/api admin/config admin/database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check service PHP syntax
        run: find service/app service/common service/config service/support service/database service/tests -name '*.php' -print0 | xargs -0 -n1 php -l

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install admin dependencies
        run: composer install -d admin --no-interaction
      - name: Run admin tests
        run: admin/vendor/bin/phpunit -c admin/phpunit.xml

  service-tests:
    name: Service Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install service dependencies
        run: composer install -d service --no-interaction
      - name: Run service tests
        run: service/vendor/bin/phpunit -c service/phpunit.xml

  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate admin composer.json
        run: composer validate -d admin --strict
      - name: Validate service composer.json
        # security-php 等第三方包的已知 composer 冲突不应阻断 CI
        continue-on-error: true
        run: composer validate -d service --strict

  flutter-build:
    name: Flutter Build (apps/flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: cd apps/flutter && flutter pub get
      - name: Analyze
        # warning 级 lint 不阻断，error 级仍失败
        run: cd apps/flutter && flutter analyze --no-fatal-warnings
      - name: Build debug APK
        run: cd apps/flutter && flutter build apk --debug

  harmonyos-check:
    name: HarmonyOS Project Check (apps/harmonyos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        run: |
          required_files=(
            "apps/harmonyos/build-profile.json5"
            "apps/harmonyos/oh-package.json5"
            "apps/harmonyos/hvigorfile.ts"
            "apps/harmonyos/hvigor/hvigor-config.json5"
            "apps/harmonyos/AppScope/app.json5"
            "apps/harmonyos/entry/oh-package.json5"
            "apps/harmonyos/entry/build-profile.json5"
            "apps/harmonyos/entry/hvigorfile.ts"
            "apps/harmonyos/entry/src/main/module.json5"
            "apps/harmonyos/entry/src/main/ets/entryability/EntryAbility.ets"
            "apps/harmonyos/entry/src/main/ets/pages/LoginPage.ets"
            "apps/harmonyos/entry/src/main/resources/base/profile/main_pages.json"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::HarmonyOS 工程缺文件，见上方 MISSING 列表"
            exit 1
          fi
          echo "Required files OK"
      - name: Validate JSON/JSON5 config files
        run: |
          python3 - <<'EOF'
          import json, re, sys, glob
          # ponytail: //-strip also removes URLs inside strings; no such json5 today, switch to a real json5 parser if one appears
          def strip_json5(s):
              s = re.sub(r'//[^\n]*', '', s)
              s = re.sub(r',\s*([}\]])', r'\1', s)
              return s
          files = sorted(glob.glob('apps/harmonyos/**/*.json5', recursive=True)) + \
                  sorted(glob.glob('apps/harmonyos/**/*.json', recursive=True))
          ok = True
          for f in files:
              try:
                  json.loads(strip_json5(open(f).read()))
              except Exception as e:
                  print(f'INVALID: {f}: {e}')
                  ok = False
          if not ok:
              sys.exit(1)
          print(f'All {len(files)} JSON/JSON5 config files parse')
          EOF
      - name: Scan ETS sources
        run: |
          python3 - <<'EOF'
          import sys, glob
          files = sorted(glob.glob('apps/harmonyos/**/*.ets', recursive=True))
          ok = True
          for f in files:
              src = open(f).read()
              if src.count('{') != src.count('}'):
                  print(f'UNBALANCED BRACES: {f}')
                  ok = False
          if not ok:
              sys.exit(1)
          print(f'{len(files)} .ets files scanned OK')
          EOF

  harmonyos-build:
    name: HarmonyOS Build (apps/harmonyos)
    runs-on: ubuntu-latest
    # 真实构建无条件执行、fail-fast（无 continue-on-error）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'        # hvigor 5.x 要求 JDK 17
      - name: Cache CLT zip
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: /tmp/clt.zip
          key: clt-6.1.1.280
      - name: Cache hvigor artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.hvigor
            apps/harmonyos/oh_modules
            apps/harmonyos/entry/oh_modules
          key: hvigor-cache-clt-6.1.1.280
      - name: Download CLT zip
        if: steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          # 主镜像 CLT 6.1.1.280（第三方）sha256 强校验（版本决策见 researcher 复核：hvigor 6.x 接受 modelVersion 5.0.0 工程）
          if wget -q -O /tmp/clt.zip https://image.cdn.dog/commandline-tools-linux-x64-6.1.1.280.zip; then
            echo "b9caf7b73c541b90e6c8f3c7c3de7f2bea9b35e41e80cd3525f2f759ebf16cf4  /tmp/clt.zip" | sha256sum -c - || { echo "::error::SHA256 mismatch"; exit 1; }
          else
            # 备选：GitHub 分发 CLT 26.0.0.461（分片拼接，README 提供 sha256）
            echo "::warning::主镜像不可用，改用 GitHub 分发 CLT 26.0.0.461（sha256 强校验）"
            wget -q -O /tmp/clt.part00 https://github.com/jerry-271828/harmonyos-commandline-tools/releases/download/v26.0.0.461/clt.zip.part00 || exit 1
            wget -q -O /tmp/clt.part01 https://github.com/jerry-271828/harmonyos-commandline-tools/releases/download/v26.0.0.461/clt.zip.part01 || exit 1
            cat /tmp/clt.part00 /tmp/clt.part01 > /tmp/clt.zip
            rm -f /tmp/clt.part00 /tmp/clt.part01
            echo "b046da0a1a06fe13b3d82d198738abc54788d79c6c9d07c36617ec7fc31a3a3b  /tmp/clt.zip" | sha256sum -c - || { echo "::error::SHA256 mismatch"; exit 1; }
          fi
      - name: Install HarmonyOS Command Line Tools
        env:
          COMMANDLINE_TOOL_DIR: ${{ runner.temp }}/harmonyos-tools
        run: |
          mkdir -p "$COMMANDLINE_TOOL_DIR"
          unzip -q /tmp/clt.zip -d "$COMMANDLINE_TOOL_DIR"
          chmod -R +x "$COMMANDLINE_TOOL_DIR"/command-line-tools/bin
      - name: Verify toolchain (hvigor + SDK)
        env:
          COMMANDLINE_TOOL_DIR: ${{ runner.temp }}/harmonyos-tools
        run: |
          export PATH="$COMMANDLINE_TOOL_DIR/command-line-tools/bin:$PATH"
          hvigorw --version
          echo "--- SDK components ---"
          ls "$COMMANDLINE_TOOL_DIR"/command-line-tools/sdk/default/
      # 两个下载源均失效时的最后手段（候选 3，人工操作）：把本地已验证的 CLT 5.1.1.820
      # 工具链上传本仓库 GitHub Release（如 tag ci-toolchain-5.1.1.820），再在下载步骤改指该 Release
      - name: Install oh-package dependencies
        working-directory: apps/harmonyos
        env:
          COMMANDLINE_TOOL_DIR: ${{ runner.temp }}/harmonyos-tools
          DEVECO_SDK_HOME: ${{ runner.temp }}/harmonyos-tools/command-line-tools/sdk
          HDC_HOME: ${{ runner.temp }}/harmonyos-tools/command-line-tools/sdk/default/openharmony/toolchains
        run: |
          export PATH="$COMMANDLINE_TOOL_DIR/command-line-tools/bin:$PATH"
          ohpm install --all
      - name: Build HAP (debug, unsigned)
        working-directory: apps/harmonyos
        env:
          COMMANDLINE_TOOL_DIR: ${{ runner.temp }}/harmonyos-tools
          DEVECO_SDK_HOME: ${{ runner.temp }}/harmonyos-tools/command-line-tools/sdk
          HDC_HOME: ${{ runner.temp }}/harmonyos-tools/command-line-tools/sdk/default/openharmony/toolchains
        run: |
          export PATH="$COMMANDLINE_TOOL_DIR/command-line-tools/bin:$PATH"
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon
      - name: Verify HAP artifact
        run: |
          hap=$(ls apps/harmonyos/entry/build/default/outputs/default/*.hap 2>/dev/null | head -1)
          [ -n "$hap" ] && echo "OK: $hap ($(stat -c%s "$hap") bytes)" || { echo "::error::no HAP output"; exit 1; }
