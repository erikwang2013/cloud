name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check admin PHP syntax
        run: find admin/app admin/api admin/config admin/database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check service PHP syntax
        run: find service/app service/common service/config service/support service/database service/tests -name '*.php' -print0 | xargs -0 -n1 php -l

  admin-tests:
    name: Admin Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install admin dependencies
        run: composer install -d admin --no-interaction
      - name: Run admin tests
        run: admin/vendor/bin/phpunit -c admin/phpunit.xml

  service-tests:
    name: Service Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install service dependencies
        run: composer install -d service --no-interaction
      - name: Run service tests
        run: service/vendor/bin/phpunit -c service/phpunit.xml

  composer-validate:
    name: Composer Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate admin composer.json
        run: composer validate -d admin --strict
      - name: Validate service composer.json
        # security-php 等第三方包的已知 composer 冲突不应阻断 CI
        continue-on-error: true
        run: composer validate -d service --strict

  flutter-build:
    name: Flutter Build (apps/flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: cd apps/flutter && flutter pub get
      - name: Analyze
        # warning 级 lint 不阻断，error 级仍失败
        run: cd apps/flutter && flutter analyze --no-fatal-warnings
      - name: Build debug APK
        run: cd apps/flutter && flutter build apk --debug

  harmonyos-check:
    name: HarmonyOS Project Check (apps/harmonyos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        run: |
          required_files=(
            "apps/harmonyos/build-profile.json5"
            "apps/harmonyos/oh-package.json5"
            "apps/harmonyos/hvigorfile.ts"
            "apps/harmonyos/hvigor/hvigor-config.json5"
            "apps/harmonyos/AppScope/app.json5"
            "apps/harmonyos/entry/oh-package.json5"
            "apps/harmonyos/entry/build-profile.json5"
            "apps/harmonyos/entry/hvigorfile.ts"
            "apps/harmonyos/entry/src/main/module.json5"
            "apps/harmonyos/entry/src/main/ets/entryability/EntryAbility.ets"
            "apps/harmonyos/entry/src/main/ets/pages/LoginPage.ets"
            "apps/harmonyos/entry/src/main/resources/base/profile/main_pages.json"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::HarmonyOS 工程缺文件，见上方 MISSING 列表"
            exit 1
          fi
          echo "Required files OK"
      - name: Validate JSON/JSON5 config files
        run: |
          python3 - <<'EOF'
          import json, re, sys, glob
          # ponytail: //-strip also removes URLs inside strings; no such json5 today, switch to a real json5 parser if one appears
          def strip_json5(s):
              s = re.sub(r'//[^\n]*', '', s)
              s = re.sub(r',\s*([}\]])', r'\1', s)
              return s
          files = sorted(glob.glob('apps/harmonyos/**/*.json5', recursive=True)) + \
                  sorted(glob.glob('apps/harmonyos/**/*.json', recursive=True))
          ok = True
          for f in files:
              try:
                  json.loads(strip_json5(open(f).read()))
              except Exception as e:
                  print(f'INVALID: {f}: {e}')
                  ok = False
          if not ok:
              sys.exit(1)
          print(f'All {len(files)} JSON/JSON5 config files parse')
          EOF
      - name: Scan ETS sources
        run: |
          python3 - <<'EOF'
          import sys, glob
          files = sorted(glob.glob('apps/harmonyos/**/*.ets', recursive=True))
          ok = True
          for f in files:
              src = open(f).read()
              if src.count('{') != src.count('}'):
                  print(f'UNBALANCED BRACES: {f}')
                  ok = False
          if not ok:
              sys.exit(1)
          print(f'{len(files)} .ets files scanned OK')
          EOF
      # Full hvigor build requires the DevEco toolchain (hvigorw + HarmonyOS SDK),
      # which is not preinstalled on this runner. When a runner provides it
      # (install DevEco Studio, run `hvigorw --version` to verify), this step
      # automatically runs the real assembleHap build instead of skipping.
      - name: Full hvigor build (when toolchain available)
        run: |
          if command -v hvigorw >/dev/null 2>&1 || command -v hvigor >/dev/null 2>&1 || [ -n "$HARMONYOS_SDK" ]; then
            echo "hvigor toolchain detected, running real build..."
            hvigorw --mode module -p product=default -p buildMode=debug assembleHap --no-daemon
          else
            echo "::warning::hvigor/DevEco toolchain not installed on this runner - skipping real build. To enable: install DevEco Studio + SDK, add hvigorw to PATH (or set HARMONYOS_SDK); this step then runs 'hvigorw assembleHap' automatically."
          fi
